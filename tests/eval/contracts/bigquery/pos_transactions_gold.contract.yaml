apiVersion: cymbal.datacontract/v1
kind: DataContract
metadata:
  id: cymbal_gold.pos_transactions_gold
  display_name: Cymbal Retail — Intraday POS Sales Transactions (Gold)
  version: 1.0.0
  status: active
  layer: gold
  domain: retail-operations
  owner:
    team: Cymbal Data Platform Engineering
    service_account: cymbal-sa-data@pj-elevate-da.iam.gserviceaccount.com
  tags: [pos, transactions, streaming, medallion-gold, sales-kpi, customer-pii, bqca]
provider:
  platform: bigquery
  project: pj-elevate-da
  dataset: cymbal_gold
  table: pos_transactions_gold
  fully_qualified_name: pj-elevate-da.cymbal_gold.pos_transactions_gold
  region: us-central1
  table_type: TABLE
  physical:
    partitioning: DAY on business_date
    clustering: none
    observed_row_count: 64649
    observed_at: "2026-09-11T02:07:00Z"
description: |
  Real-time streaming intraday POS sales transactions with customer PII for daily store
  revenue and sales KPI monitoring, used for today's sales and daily revenue KPIs. Each row
  is one completed checkout at a Cymbal Retail storefront, carrying payment, discount and
  tender attributes plus a repeated `items` record holding the basket line items. The
  Cymbal Retail Analytics Data Agent (BQCA) treats this as the authoritative source for
  intraday sales checkouts and filters on `business_date = CURRENT_DATE()` unless an explicit
  date range is requested. Historical (multi-day) purchase lookups and warranty claims are
  intentionally routed to `historical_transactional_data` instead of this table.
lineage:
  produced_by: >-
    Module 2 Challenge 1.2 medallion streaming path — Managed Kafka `kafka-cluster` -> Pub/Sub
    topic `pos-transactions-topic` (Single Message Transform JavaScript UDF
    `transforms/add_business_date.js` derives `business_date` with a 04:00 local cutoff) ->
    direct Pub/Sub BigQuery subscription writing the Gold tier.
  upstream:
    - Managed Service for Apache Kafka cluster `kafka-cluster` (POS checkout events)
    - Pub/Sub topic pos-transactions-topic (DLQ: pos-transactions-dead-letter-topic)
    - pj-elevate-da.cymbal_gold.pos_transactions_raw (Bronze)
    - pj-elevate-da.cymbal_gold.pos_transactions_silver (Silver CDC stream)
  consumed_by:
    - Cymbal Retail Analytics Data Agent (BQCA)
    - cymbal_operations_agent (ADK coordinator, via cymbal_analytics_tool)
    - Dataplex data quality scan `pos-transactions-quality-scan`
    - Module 2 Challenge 2.1 remote model cymbal_models.order_anomaly_model (anomaly scoring)
