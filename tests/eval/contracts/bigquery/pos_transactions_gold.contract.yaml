service_levels:
  freshness: >-
    Continuous / near-real-time. Rows land via a direct Pub/Sub-to-BigQuery subscription fed by
    the Managed Kafka POS event stream, so latency is streaming-ingest bound rather than batch
    scheduled. No formal freshness SLO has been published; the numeric target is unknown.
  retention: unknown
  availability: "BigQuery regional SLA (us-central1)"
quality:
  rules:
    - id: transaction_id_not_null
      dimension: completeness
      column: transaction_id
      assertion: transaction_id IS NOT NULL for every row.
      threshold: 1.0
      enforced_by: dataplex-dq-scan
    - id: transaction_id_unique
      dimension: uniqueness
      column: transaction_id
      assertion: COUNT(DISTINCT transaction_id) = COUNT(*) — one row per completed checkout.
      threshold: 1.0
      enforced_by: dataplex-dq-scan
    - id: business_date_matches_event_timestamp
      dimension: consistency
      column: business_date
      assertion: >-
        business_date is the date portion derived from event_timestamp by the SMT UDF using the
        04:00 local business-day cutoff, and is never NULL (it is the partitioning column).
      threshold: 1.0
      enforced_by: dataplex-dq-scan
    - id: total_amount_non_negative
      dimension: validity
      column: total
      assertion: total >= 0 for every row (sales totals are never negative in the gold tier).
      threshold: 1.0
      enforced_by: not-enforced
    - id: item_count_matches_items_array
      dimension: consistency
      column: item_count
      assertion: item_count = ARRAY_LENGTH(items) — the scalar item count agrees with the repeated items record.
      threshold: 0.99
      enforced_by: not-enforced
    - id: intraday_partition_present
      dimension: timeliness
      column: business_date
      assertion: >-
        At least one row exists for business_date = CURRENT_DATE() while the streaming pipeline is
        running, so the agent's default `business_date = CURRENT_DATE()` filter returns data.
      threshold: 1.0
      enforced_by: eval-fixture
governance:
  classification: confidential
  pii_columns: [customer_id]
  column_level_security: >-
    NOT enforced on this base table. The Module 1 Lab 4 column-level pattern — Cloud Resource
    Manager tag key `pii_classification` (tagKeys/281480941817283) with values customer_name/High,
    customer_id/Med, financial_amount/Med, store_metadata/Low, bound to RAW_DATA_ACCESS_POLICY and
    DATA_MASKING_POLICY data policies (SHA256 hash for names, XXXXX<last4> for customer IDs, $0.00
    for amounts) — was demonstrated on the dedicated working copy
    `pj-elevate-da.cymbal_gold.aws_pos_transactions_gold2`, not on
    `pj-elevate-da.cymbal_gold.pos_transactions_gold`. The columns that would be tagged here are
    customer_id, card_bin, subtotal_amount, discount, tax_amount and total.
  row_level_security: >-
    NOT enforced on this base table. The Lab 4 row-access-policy pattern (unrestricted lead vs.
    store-scoped analyst) was demonstrated on `gold_inventory_reconciliation_ledger2`. Applying it
    here would filter on store_id for store-scoped personas.
evaluation:
  exercised_by_eval_cases:
    - UC_2.1a_warranty_transaction
    - UC_2.3_cross-cloud_offender_audit_sequential_dispatch
    - UC_2.2_dual_cashier_baseline_parallel_dispatch
