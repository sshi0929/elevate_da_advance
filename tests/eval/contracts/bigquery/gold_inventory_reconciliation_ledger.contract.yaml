apiVersion: cymbal.datacontract/v1
kind: DataContract
metadata:
  id: cymbal_gold.gold_inventory_reconciliation_ledger
  display_name: Cymbal Retail — Daily Inventory Reconciliation Ledger (Gold)
  version: 1.0.0
  status: active
  layer: gold
  domain: retail-operations
  owner:
    team: Cymbal Data Platform Engineering
    service_account: cymbal-sa-data@pj-elevate-da.iam.gserviceaccount.com
  tags: [inventory, reconciliation, stockout-risk, cover-hours, iceberg, medallion-gold, bqca]
provider:
  platform: bigquery
  project: pj-elevate-da
  dataset: cymbal_gold
  table: gold_inventory_reconciliation_ledger
  fully_qualified_name: pj-elevate-da.cymbal_gold.gold_inventory_reconciliation_ledger
  region: us-central1
  table_type: TABLE
  physical:
    partitioning: none
    clustering: [reconciliation_status, store_id]
    observed_row_count: 8400
    observed_at: "2026-09-11T02:07:00Z"
description: |
  Daily reconciled store inventory ledger tracking opening balance, shelf/backroom quantities,
  intraday revenue, and remaining cover hours for stockout risk analysis. Each row is one
  store/item position for a given business_date, produced by reconciling the lakehouse inventory
  and sales sources into a single gold sink. The Cymbal Retail Analytics Data Agent uses this as
  the authoritative source for store inventory and cover hours, computes total on-hand inventory
  as `(shelf_qty + backroom_qty)`, derives the `Shelf Stock Ratio` metric as
  `SAFE_DIVIDE(shelf_qty, (shelf_qty + backroom_qty)) * 100`, and applies the
  `est_cover_hours_remaining < 20.0` filter only when stockout risk or critical cover hours are
  explicitly requested. GEMINI.md records this gold sink as a BigLake Managed Iceberg table
  written with `writeMethod=direct`; the snapshot reports `table_type: TABLE` and `num_bytes: 0`,
  which is consistent with Iceberg-managed storage.
lineage:
  produced_by: >-
    Cloud Composer DAG `cymbal_nightly_inventory_reconciliation` on environment `cymbal-airflow-env`
    (Composer 3 / Airflow 2.10.5), which submits the migrated PySpark job
    `migrated_inventory_reconciliation_pipeline.py` via DataprocCreateBatchOperator on the Dataproc
    Serverless Lightning Engine, then gates the load with a BigQueryCheckOperator asserting
    COUNT(*) = 8400.
  upstream:
    - pj-elevate-da.cymbal-lakehouse.elevate_data (federated AWS S3 Iceberg catalog via BigLake REST Catalog)
    - GCS staging bucket gs://pj-elevate-da-module1-bucket
  consumed_by:
    - Cymbal Retail Analytics Data Agent (BQCA)
    - cymbal_operations_agent (ADK coordinator, via cymbal_analytics_tool)
    - Dataplex data quality scan a22da5b88-9611-466c-9c95-29fae7e8e89a
    - Dataplex lineage graph (OpenLineage, 3 lakehouse sources -> gold ledger)
schema:
  - name: business_date
    type: DATE
    mode: NULLABLE
    description: Business date of the reconciled inventory position.
    description_source: authored
    semantic: date
    classification: internal
  - name: store_id
    type: STRING
    mode: NULLABLE
    description: Identifier of the Cymbal Retail store holding the inventory position.
    description_source: authored
    semantic: dimension
    classification: internal
  - name: store_name
    type: STRING
    mode: NULLABLE
    description: Human readable name of the store.
    description_source: authored
    semantic: dimension
    classification: internal
  - name: city
    type: STRING
    mode: NULLABLE
    description: City in which the store is located.
    description_source: authored
    semantic: dimension
    classification: internal
  - name: item_id
    type: STRING
    mode: NULLABLE
    description: Item SKU / product identifier for the reconciled inventory position.
    description_source: authored
    semantic: identifier
    classification: internal
  - name: unit_price_usd
    type: FLOAT
    mode: NULLABLE
    description: Unit selling price of the item in USD.
    description_source: authored
    semantic: measure
    classification: internal
  - name: opening_qty
    type: INTEGER
    mode: NULLABLE
    description: Opening on-hand quantity at the start of the business date.
    description_source: authored
    semantic: measure
    classification: internal
  - name: shelf_qty
    type: INTEGER
    mode: NULLABLE
    description: Units currently placed on the retail sales floor shelves.
    description_source: authored
    semantic: measure
    classification: internal
  - name: backroom_qty
    type: INTEGER
    mode: NULLABLE
    description: Units currently held in backroom storage.
    description_source: authored
    semantic: measure
    classification: internal
  - name: intraday_gross_revenue_usd
    type: FLOAT
    mode: NULLABLE
    description: Gross revenue in USD generated by this store/item position during the business date.
    description_source: authored
    semantic: measure
    classification: confidential
  - name: est_cover_hours_remaining
    type: FLOAT
    mode: NULLABLE
    description: >-
      Estimated operational hours remaining until stockout given current sales velocity and on-hand
      inventory; values below 20.0 denote stockout risk.
    description_source: authored
    semantic: measure
    classification: internal
  - name: reconciliation_status
    type: STRING
    mode: NULLABLE
    description: >-
      Outcome band assigned by the reconciliation pipeline. The pipeline emits exactly three verbatim
      string literals, verified against the live table and re-confirmed by the contract validator:
      'CRITICAL BURN SPIKE - STOCKOUT RISK' (51 rows), 'MONITOR VELOCITY' (84 rows) and
      'RECONCILED NORMAL HEALTH' (8,265 rows). Note: earlier project documentation abbreviates these
      as "Critical / Monitor / Normal"; those shorthand forms are NOT the stored values and must not
      be used in SQL predicates.
    description_source: authored
    semantic: dimension
    classification: internal
service_levels:
  freshness: >-
    Nightly batch. The ledger is rebuilt by the Cloud Composer DAG
    `cymbal_nightly_inventory_reconciliation`; the exact cron schedule and cut-off time are unknown
    from the available evidence.
  retention: unknown
  availability: "BigQuery regional SLA (us-central1)"
quality:
  rules:
    - id: expected_row_count
      dimension: completeness
      column: "*"
      assertion: >-
        COUNT(*) = 8400 after each nightly reconciliation run — the same assertion enforced by the
        BigQueryCheckOperator gate in the Composer DAG and observed in the live snapshot.
      threshold: 1.0
      enforced_by: dataplex-dq-scan
    - id: store_item_date_grain_unique
      dimension: uniqueness
      column: "*"
      assertion: >-
        The tuple (business_date, store_id, item_id) is unique — one reconciled position per
        store/item per business date.
      threshold: 1.0
      enforced_by: not-enforced
    - id: inventory_keys_not_null
      dimension: completeness
      column: store_id
      assertion: store_id, item_id and business_date are all NOT NULL.
      threshold: 1.0
      enforced_by: dataplex-dq-scan
    - id: quantities_non_negative
      dimension: validity
      column: shelf_qty
      assertion: shelf_qty >= 0, backroom_qty >= 0 and opening_qty >= 0 for every row.
      threshold: 1.0
      enforced_by: not-enforced
    - id: cover_hours_non_negative
      dimension: validity
      column: est_cover_hours_remaining
      assertion: >-
        est_cover_hours_remaining IS NOT NULL AND est_cover_hours_remaining >= 0, so the
        `< 20.0` stockout-risk filter is well defined.
      threshold: 1.0
      enforced_by: eval-fixture
    - id: reconciliation_status_enumerated
      dimension: consistency
      column: reconciliation_status
      assertion: >-
        reconciliation_status only takes the three verbatim literals produced by the reconciliation
        pipeline — 'CRITICAL BURN SPIKE - STOCKOUT RISK', 'MONITOR VELOCITY' and
        'RECONCILED NORMAL HEALTH' — matching the 51 / 84 / 8,265 distribution verified during the
        Module 1 Lab 1 multi-engine parity benchmark.
      threshold: 1.0
      enforced_by: eval-fixture
governance:
  classification: internal
  pii_columns: []
  column_level_security: >-
    NOT enforced on this base table. No Module 1 Lab 4 data governance tags or masking policies were
    attached to gold_inventory_reconciliation_ledger; the column-tag work (tag key
    `pii_classification`, values customer_name/customer_id/financial_amount/store_metadata) was
    applied to the dedicated working copy `aws_pos_transactions_gold2`. If extended here, the
    `financial_amount` and `store_metadata` tag values would map to intraday_gross_revenue_usd /
    unit_price_usd and store_id / store_name / city respectively.
  row_level_security: >-
    NOT enforced on this base table. The row access policies `rls_unrestricted_lead`
    (FILTER USING (TRUE)) and `rls_analyst_stores` (store_id IN ('STORE_048','STORE_009')) were
    provisioned in Module 1 Lab 4 on the dedicated working copy
    `pj-elevate-da.cymbal_gold.gold_inventory_reconciliation_ledger2`, which carries the same 8,400
    rows and schema. That store_id-scoped pattern is the one that would apply to this table.
evaluation:
  exercised_by_eval_cases:
    - UC_1.2a_stockout_risk_lt_20h
